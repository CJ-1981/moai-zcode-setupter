name: Release macOS app

on:
  push:
    tags: ["v*"]

permissions:
  contents: write

jobs:
  build-macos:
    runs-on: macos-14
    steps:
      - uses: actions/checkout@v4

      - name: Install uv
        uses: astral-sh/setup-uv@v5
        with:
          python-version: "3.12"

      - name: Install dependencies
        run: uv sync

      - name: Build .app with PyInstaller
        run: |
          uv run pyinstaller main.py \
            --name "MoAI-ZCode-Setupter" \
            --windowed --onefile --clean -y

      - name: Zip .app bundle
        run: |
          cd dist
          ditto -c -k --keepParent MoAI-ZCode-Setupter.app MoAI-ZCode-Setupter-macos.zip

      - name: Attach to release
        uses: softprops/action-gh-release@v2
        with:
          files: dist/MoAI-ZCode-Setupter-macos.zip
          generate_release_notes: true
